version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: lemma-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lemma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lemma"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
